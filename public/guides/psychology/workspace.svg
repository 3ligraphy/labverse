<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Your workspace, at a glance</title><desc id="desc">Three tabs. One place to keep your work.</desc><rect width="1200" height="570" rx="24" fill="#101e25"/><g font-family="Arial, sans-serif"><text x="48" y="64" fill="#99cbb8" font-size="14" letter-spacing="3">MINDCARE / VISUAL GUIDE</text><text x="48" y="118" fill="#f6f7f3" font-size="38" font-weight="700">Your workspace, at a glance</text><text x="48" y="154" fill="#bbc9cc" font-size="21">Three tabs. One place to keep your work.</text><rect x="48" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="70" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="70" y="274" fill="#b5e2cf" font-size="18" font-weight="700">LAB INSTRUCTIONS</text><text x="70" y="320" fill="#edf2f0" font-size="18">Read the next task</text><text x="70" y="356" fill="#edf2f0" font-size="18">Check the expected result</text><text x="70" y="392" fill="#edf2f0" font-size="18">Tick Done when finished</text><rect x="424" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="446" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="446" y="274" fill="#b5e2cf" font-size="18" font-weight="700">WORDPRESS</text><text x="446" y="320" fill="#edf2f0" font-size="18">Build and preview the site</text><text x="446" y="356" fill="#edf2f0" font-size="18">Save your changes</text><text x="446" y="392" fill="#edf2f0" font-size="18">Export your ZIP backup</text><rect x="800" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="822" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="822" y="274" fill="#b5e2cf" font-size="18" font-weight="700">AI ASSISTANT</text><text x="822" y="320" fill="#edf2f0" font-size="18">Give a clear prompt</text><text x="822" y="356" fill="#edf2f0" font-size="18">Check the draft</text><text x="822" y="392" fill="#edf2f0" font-size="18">Ask for one improvement</text><text x="48" y="505" fill="#b5e2cf" font-size="18">COURSE FOLDER  /  Backups  /  Images  /  Notes</text><text x="48" y="542" fill="#849b9f" font-size="13">Teaching illustration · not a software screenshot</text></g></svg>