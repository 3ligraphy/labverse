<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">From your browser to the web</title><desc id="desc">One public website. A CMS you can still edit.</desc><rect width="1200" height="570" rx="24" fill="#101e25"/><g font-family="Arial, sans-serif"><text x="48" y="64" fill="#99cbb8" font-size="14" letter-spacing="3">MINDCARE / VISUAL GUIDE</text><text x="48" y="118" fill="#f6f7f3" font-size="38" font-weight="700">From your browser to the web</text><text x="48" y="154" fill="#bbc9cc" font-size="21">One public website. A CMS you can still edit.</text><rect x="48" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="70" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="70" y="274" fill="#b5e2cf" font-size="18" font-weight="700">SOURCE / PLAYGROUND</text><text x="70" y="320" fill="#edf2f0" font-size="18">Keep a full ZIP backup</text><text x="70" y="356" fill="#edf2f0" font-size="18">Export content as XML</text><text x="70" y="392" fill="#edf2f0" font-size="18">Collect images and design notes</text><rect x="424" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="446" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="446" y="274" fill="#b5e2cf" font-size="18" font-weight="700">LIVE / WORDPRESS HOST</text><text x="446" y="320" fill="#edf2f0" font-size="18">Import content and upload images</text><text x="446" y="356" fill="#edf2f0" font-size="18">Restore theme, styles and menu</text><text x="446" y="392" fill="#edf2f0" font-size="18">Publish at your HTTPS address</text><rect x="800" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="822" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="822" y="274" fill="#b5e2cf" font-size="18" font-weight="700">VERIFY / HAND OVER</text><text x="822" y="320" fill="#edf2f0" font-size="18">Test while signed out</text><text x="822" y="356" fill="#edf2f0" font-size="18">Make a live CMS edit</text><text x="822" y="392" fill="#edf2f0" font-size="18">Submit URL and recovery notes</text><text x="48" y="505" fill="#b5e2cf" font-size="18">A Playground ZIP is a backup. Deployment needs a public host and a working CMS.</text><text x="48" y="542" fill="#849b9f" font-size="13">Teaching illustration · not a software screenshot</text></g></svg>