<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Save is not the same as back up</title><desc id="desc">Keep your work ready for the next session.</desc><rect width="1200" height="570" rx="24" fill="#101e25"/><g font-family="Arial, sans-serif"><text x="48" y="64" fill="#99cbb8" font-size="14" letter-spacing="3">MINDCARE / VISUAL GUIDE</text><text x="48" y="118" fill="#f6f7f3" font-size="38" font-weight="700">Save is not the same as back up</text><text x="48" y="154" fill="#bbc9cc" font-size="21">Keep your work ready for the next session.</text><rect x="48" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="70" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="70" y="274" fill="#b5e2cf" font-size="18" font-weight="700">01 / SAVE THE EDIT</text><text x="70" y="320" fill="#edf2f0" font-size="18">Save in the WordPress editor</text><text x="70" y="356" fill="#edf2f0" font-size="18">Then store the Playground</text><text x="70" y="392" fill="#edf2f0" font-size="18">Look for the Saved status</text><rect x="424" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="446" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="446" y="274" fill="#b5e2cf" font-size="18" font-weight="700">02 / EXPORT THE SITE</text><text x="446" y="320" fill="#edf2f0" font-size="18">Dock → Export</text><text x="446" y="356" fill="#edf2f0" font-size="18">Download as .zip</text><text x="446" y="392" fill="#edf2f0" font-size="18">Keep a second copy</text><rect x="800" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="822" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="822" y="274" fill="#b5e2cf" font-size="18" font-weight="700">03 / RESTORE + CHECK</text><text x="822" y="320" fill="#edf2f0" font-size="18">Dock → New → Import zip</text><text x="822" y="356" fill="#edf2f0" font-size="18">Open your exported file</text><text x="822" y="392" fill="#edf2f0" font-size="18">Check your own pages and text</text><text x="48" y="505" fill="#b5e2cf" font-size="18">SESSION 1: mindcare-session1.zip  →  SESSION 2: restore and keep building</text><text x="48" y="542" fill="#849b9f" font-size="13">Teaching illustration · not a software screenshot</text></g></svg>