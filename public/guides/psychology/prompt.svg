<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">A better prompt starts with context</title><desc id="desc">Use this recipe, then review what comes back.</desc><rect width="1200" height="570" rx="24" fill="#101e25"/><g font-family="Arial, sans-serif"><text x="48" y="64" fill="#99cbb8" font-size="14" letter-spacing="3">MINDCARE / VISUAL GUIDE</text><text x="48" y="118" fill="#f6f7f3" font-size="38" font-weight="700">A better prompt starts with context</text><text x="48" y="154" fill="#bbc9cc" font-size="21">Use this recipe, then review what comes back.</text><rect x="48" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="70" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="70" y="274" fill="#b5e2cf" font-size="18" font-weight="700">01 / AUDIENCE + TASK</text><text x="70" y="320" fill="#edf2f0" font-size="18">Who will read this?</text><text x="70" y="356" fill="#edf2f0" font-size="18">What page are you making?</text><text x="70" y="392" fill="#edf2f0" font-size="18">What should the reader learn?</text><rect x="424" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="446" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="446" y="274" fill="#b5e2cf" font-size="18" font-weight="700">02 / CONSTRAINTS</text><text x="446" y="320" fill="#edf2f0" font-size="18">State the length and tone</text><text x="446" y="356" fill="#edf2f0" font-size="18">Name the required sections</text><text x="446" y="392" fill="#edf2f0" font-size="18">Use fictional details</text><rect x="800" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="822" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="822" y="274" fill="#b5e2cf" font-size="18" font-weight="700">03 / REVIEW + REVISE</text><text x="822" y="320" fill="#edf2f0" font-size="18">Check every claim</text><text x="822" y="356" fill="#edf2f0" font-size="18">Remove invented facts</text><text x="822" y="392" fill="#edf2f0" font-size="18">Ask for a specific improvement</text><text x="48" y="505" fill="#b5e2cf" font-size="18">YOU MAKE THE FINAL DECISION  •  A fluent answer still needs checking</text><text x="48" y="542" fill="#849b9f" font-size="13">Teaching illustration · not a software screenshot</text></g></svg>