<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">From an idea to a working block</title><desc id="desc">Make small changes you can understand.</desc><rect width="1200" height="570" rx="24" fill="#101e25"/><g font-family="Arial, sans-serif"><text x="48" y="64" fill="#99cbb8" font-size="14" letter-spacing="3">MINDCARE / VISUAL GUIDE</text><text x="48" y="118" fill="#f6f7f3" font-size="38" font-weight="700">From an idea to a working block</text><text x="48" y="154" fill="#bbc9cc" font-size="21">Make small changes you can understand.</text><rect x="48" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="70" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="70" y="274" fill="#b5e2cf" font-size="18" font-weight="700">READ + EDIT</text><text x="70" y="320" fill="#edf2f0" font-size="18">Find the value to change</text><text x="70" y="356" fill="#edf2f0" font-size="18">Change one thing</text><text x="70" y="392" fill="#edf2f0" font-size="18">Keep the original nearby</text><rect x="424" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="446" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="446" y="274" fill="#b5e2cf" font-size="18" font-weight="700">TEST IN THE SANDBOX</text><text x="446" y="320" fill="#edf2f0" font-size="18">Run the preview</text><text x="446" y="356" fill="#edf2f0" font-size="18">Check narrow and wide views</text><text x="446" y="392" fill="#edf2f0" font-size="18">Fix problems before copying</text><rect x="800" y="204" width="352" height="236" rx="16" fill="#1e313a" stroke="#47625f"/><rect x="822" y="230" width="42" height="5" rx="2" fill="#99cbb8"/><text x="822" y="274" fill="#b5e2cf" font-size="18" font-weight="700">USE IN WORDPRESS</text><text x="822" y="320" fill="#edf2f0" font-size="18">Add a Custom HTML block</text><text x="822" y="356" fill="#edf2f0" font-size="18">Paste the working code</text><text x="822" y="392" fill="#edf2f0" font-size="18">Preview, then save</text><text x="48" y="505" fill="#b5e2cf" font-size="18">IF IT BREAKS: undo the last change, test again, then ask for help</text><text x="48" y="542" fill="#849b9f" font-size="13">Teaching illustration · not a software screenshot</text></g></svg>